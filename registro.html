<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Cuenta - Mil Sabores</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Pacifico&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="menu-pasteleria shadow-sm">

        <nav class="navbar navbar-dark container">

            <a class="navbar-brand brand-title" href="index.html">
                🍰 Mil Sabores
            </a>

            <a
                href="index.html"
                class="btn btn-outline-light btn-sm">
                Volver a la tienda
            </a>

        </nav>

    </header>


    <main class="container flex-grow-1 py-5">

        <section class="registro-container">

            <div class="text-center mb-4">

                <span class="icono-seccion">
                    🧁
                </span>

                <h1 class="heading-pacific">
                    Crear una cuenta
                </h1>

                <p class="text-muted">
                    Regístrate y disfruta de los beneficios de Mil Sabores.
                </p>

            </div>


            <div class="card formulario-card border-0 shadow-sm">

                <div class="card-body p-4 p-lg-5">

                    <form id="form-registro">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="run" class="form-label">
                                    RUN
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="run"
                                    name="run"
                                    placeholder="19011022K"
                                    minlength="7"
                                    maxlength="9"
                                    required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="fechaNacimiento" class="form-label">
                                    Fecha de nacimiento
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="fechaNacimiento"
                                    name="fechaNacimiento">

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="nombre" class="form-label">
                                    Nombre
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    name="nombre"
                                    maxlength="50"
                                    required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="apellidos" class="form-label">
                                    Apellidos
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="apellidos"
                                    name="apellidos"
                                    maxlength="100"
                                    required>

                            </div>


                            <div class="col-12 mb-3">

                                <label for="correo" class="form-label">
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    maxlength="100"
                                    required>

                                <div class="form-text">
                                    Se permiten correos @duoc.cl,
                                    @profesor.duoc.cl y @gmail.com.
                                </div>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="password" class="form-label">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="codigoDescuento" class="form-label">
                                    Código de beneficio
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="codigoDescuento"
                                    name="codigoDescuento"
                                    placeholder="Opcional">

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="region" class="form-label">
                                    Región
                                </label>

                                <select
                                    class="form-select"
                                    id="region"
                                    name="region"
                                    required>

                                    <option value="">
                                        Selecciona una región
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label for="comuna" class="form-label">
                                    Comuna
                                </label>

                                <select
                                    class="form-select"
                                    id="comuna"
                                    name="comuna"
                                    required>

                                    <option value="">
                                        Selecciona una comuna
                                    </option>

                                </select>

                            </div>


                            <div class="col-12 mb-4">

                                <label for="direccion" class="form-label">
                                    Dirección
                                </label>

                                <textarea
                                    class="form-control"
                                    id="direccion"
                                    name="direccion"
                                    rows="3"
                                    maxlength="300"
                                    required></textarea>

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-danger w-100">
                            Crear cuenta
                        </button>

                    </form>


                    <p class="text-center mt-4 mb-0">

                        ¿Ya tienes una cuenta?

                        <a href="login.html">
                            Iniciar sesión
                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer class="footer-pasteleria py-4 text-white">

        <div class="container text-center">

            <p class="mb-0">
                © 2026 Pastelería Mil Sabores · DSY1104 Duoc UC
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/registro.js"></script>

</body>
</html>
