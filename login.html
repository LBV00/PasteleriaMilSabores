<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - Mil Sabores</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Pacifico&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="menu-pasteleria shadow-sm">

        <nav class="navbar navbar-dark container">

            <a class="navbar-brand brand-title" href="index.html">
                🍰 Mil Sabores
            </a>

            <a
                href="index.html"
                class="btn btn-outline-light btn-sm">
                Volver a la tienda
            </a>

        </nav>

    </header>


    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">

        <section class="login-container">

            <div class="text-center mb-4">

                <span class="icono-seccion">
                    🍰
                </span>

                <h1 class="heading-pacific">
                    Bienvenido
                </h1>

                <p class="text-muted">
                    Ingresa a tu cuenta de Mil Sabores.
                </p>

            </div>


            <div class="card formulario-card border-0 shadow-sm">

                <div class="card-body p-4">

                    <form id="form-login">

                        <div class="mb-3">

                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="correo"
                                name="correo"
                                required>

                        </div>


                        <div class="mb-4">

                            <label for="password" class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-danger w-100">
                            Iniciar Sesión
                        </button>

                    </form>


                    <p class="text-center mt-4 mb-0">

                        ¿No tienes una cuenta?

                        <a href="registro.html">
                            Crear cuenta
                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer class="footer-pasteleria py-4 text-white">

        <div class="container text-center">

            <p class="mb-0">
                © 2026 Pastelería Mil Sabores · DSY1104 Duoc UC
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/form-utils.js"></script>
    <script src="assets/js/login.js"></script>

</body>
</html>
