<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito - Pastelería Mil Sabores</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Pacifico&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="menu-pasteleria shadow-sm">

        <nav class="navbar navbar-dark container">

            <a class="navbar-brand brand-title" href="index.html">
                🍰 Mil Sabores
            </a>

            <a href="productos.html" class="btn btn-outline-light btn-sm">
                Seguir comprando
            </a>

        </nav>

    </header>


    <main class="container flex-grow-1 py-5">

        <section class="text-center pagina-encabezado">

            <p class="titulo-etiqueta">
                TU COMPRA
            </p>

            <h1 class="heading-pacific">
                Carrito de compras
            </h1>

            <p>
                Revisa tus productos antes de confirmar tu compra.
            </p>

        </section>


        <section class="row g-4 mt-3">

            <div class="col-lg-8">

                <div class="card carrito-card border-0 shadow-sm">

                    <div class="card-body">

                        <div id="carrito-contenido">
                        </div>

                    </div>

                </div>

            </div>


            <aside class="col-lg-4">

                <div class="card resumen-card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="h4 fw-bold">
                            Resumen
                        </h2>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <span>
                                Subtotal
                            </span>

                            <strong id="subtotal-carrito">
                                $0
                            </strong>

                        </div>


                        <div class="d-flex justify-content-between mt-2">

                            <span>
                                Descuento
                            </span>

                            <strong id="descuento-carrito">
                                $0
                            </strong>

                        </div>


                        <hr>


                        <div class="d-flex justify-content-between">

                            <span class="fw-bold">
                                Total
                            </span>

                            <strong
                                class="fs-4 text-danger"
                                id="total-carrito">
                                $0
                            </strong>

                        </div>


                        <button
                            type="button"
                            class="btn btn-danger w-100 mt-4"
                            id="btn-finalizar-compra">

                            Finalizar compra

                        </button>

                    </div>

                </div>

            </aside>

        </section>

    </main>


    <footer class="footer-pasteleria py-4 mt-auto text-white">

        <div class="container text-center">

            <p class="mb-0">
                © 2026 Pastelería Mil Sabores · DSY1104 Duoc UC
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/carrito.js"></script>
    <script src="assets/js/menu.js"></script>

</body>
</html>
