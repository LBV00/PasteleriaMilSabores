<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <title>Mi Carrito - Pastelería Mil Sabores</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Pacifico&display=swap" rel="stylesheet"/>
        <link href="assets/css/estilos.css" rel="stylesheet"/>
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="menu-pasteleria shadow-sm">
            <nav aria-label="Navegación principal" class="navbar navbar-expand-lg navbar-dark container">
                <div class="container-fluid">
                    <a class="navbar-brand brand-title" href="index.html">🍰 Mil Sabores</a>
                    <button aria-controls="navPrincipal" aria-expanded="false" aria-label="Abrir menú de navegación" class="navbar-toggler" data-bs-target="#navPrincipal" data-bs-toggle="collapse" type="button">
                        <span class="navbar-toggler-icon">
                        </span>
                    </button>
                    <div class="collapse navbar-collapse" id="navPrincipal">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                            <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                            <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                        </ul>
                        <div class="d-flex align-items-center gap-2 header-actions">
                            <a class="btn btn-outline-light btn-sm" href="login.html">Iniciar Sesión</a>
                            <a class="btn btn-light btn-sm text-primary fw-bold" href="registro.html">Crear Cuenta</a>
                            <a class="text-white text-decoration-none fw-bold position-relative" href="carrito-vista.html">
                                🛒 Carrito (
                                <span class="badge bg-danger rounded-pill" id="cart-count">0</span>
                                )
                            </a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main class="container my-5 flex-grow-1">
            <h1 class="fw-bold mb-4 heading-pacific text-dark-brown">Mi Carrito de Compras</h1>
            <div class="row g-4">
                <!-- Lista de productos añadidos -->
                <div class="col-lg-8">
                    <div class="card p-4 border-0 shadow-sm rounded-4" id="contenedor-items-carro">
                        <!-- Dinámico con JS -->
                    </div>
                </div>
                <!-- Panel de Compra y Cupones -->
                <div class="col-lg-4">
                    <div class="card p-4 border-0 shadow-sm bg-white rounded-4">
                        <h4 class="fw-bold mb-3 text-dark-brown">Resumen del Pedido</h4>
                        <hr/>
                        <div class="d-flex justify-content-between mb-3 fs-5">
                            <span>Total:</span>
                            <span class="fw-bold text-danger fs-3" id="cart-total-pago">$0</span>
                        </div>
                        <!-- Código Promocional Requerido "FELICES50" -->
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted" for="cupon-descuento">¿Tienes un código promocional?</label>
                            <div class="input-group">
                                <input class="form-control" id="cupon-descuento" placeholder="Ej: FELICES50" type="text"/>
                                <button class="btn btn-outline-danger" id="btn-aplicar-cupon" type="button">Aplicar</button>
                            </div>
                            <div class="form-text mt-2" id="cupon-mensaje">
                            </div>
                        </div>
                        <button class="btn btn-success w-100 py-3 fw-bold shadow" id="btn-pagar">REALIZAR COMPRA</button>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer-pasteleria py-4 mt-auto text-white">
            <div class="container text-center">
                <p class="mb-1">© 2026 Pastelería Mil Sabores. Tradición y sabor en tu mesa.</p>
                <p class="small mb-0">Proyecto académico · DSY1104 Duoc UC</p>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/carrito.js"></script>
    <script src="assets/js/menu.js"></script>
</body>
</html>
