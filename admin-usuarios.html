<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <title>Administrar Usuarios - Mil Sabores</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Pacifico&display=swap" rel="stylesheet"/>
        <link href="assets/css/estilos.css" rel="stylesheet"/>
    </head>
    <body class="admin-body d-flex flex-column min-vh-100">
        <header class="menu-pasteleria shadow-sm">
            <nav aria-label="Navegación administrativa" class="navbar navbar-dark container">
                <div class="container-fluid">
                    <a class="navbar-brand brand-title" href="admin-home.html">🎂 Panel Admin</a>
                    <a class="btn btn-outline-light btn-sm" href="index.html">Volver a la tienda</a>
                </div>
            </nav>
        </header>
        <main class="container py-5 flex-grow-1">
            <section aria-labelledby="titulo-usuarios">
                <h1 class="h2 text-dark-brown fw-bold" id="titulo-usuarios">Mantenedor de Usuarios</h1>
                <p class="text-muted">Los datos corresponden a una demostración frontend. No se almacenan contraseñas.</p>
            </section>
            <section class="card border-0 shadow-sm p-4 mt-4">
                <div class="table-responsive tabla-contenedor">
                    <table class="table table-hover align-middle" id="tabla-usuarios">
                        <thead class="table-dark">
                            <tr>
                                <th>
                                    RUN
                                </th>
                                <th>
                                    Nombre
                                </th>
                                <th>
                                    Correo
                                </th>
                                <th>
                                    Región
                                </th>
                                <th>
                                    Comuna
                                </th>
                                <th>
                                    Rol
                                </th>
                                <th>
                                    Acción
                                </th>
                            </tr>
                        </thead>
                        <tbody id="usuarios-cuerpo">
                        </tbody>
                    </table>
                </div>
                <p class="text-muted mb-0" id="usuarios-vacio">
                </p>
            </section>
        </main>
        <footer class="footer-pasteleria py-4 text-white">
            <div class="container text-center">
                <p class="mb-0 small">© 2026 Pastelería Mil Sabores · DSY1104 Duoc UC</p>
            </div>
        </footer>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/admin-guard.js"></script>
    <script src="assets/js/app.js"></script>
